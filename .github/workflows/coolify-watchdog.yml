# Coolify system check — run on command.
#
# Trigger it from the Actions tab (web) or the GitHub mobile app:
# Actions → "Coolify System Check" → Run workflow. The result is binary at a
# glance: green = everything healthy, red = problems found (the job summary
# lists them, with log excerpts).
#
# Required repo configuration (Settings → Secrets and variables → Actions):
#   Secret   COOLIFY_API_TOKEN   Coolify UI → Keys & Tokens → API tokens
#   Variable COOLIFY_API_URL     e.g. https://apps.example.com

name: Coolify System Check

on:
  workflow_dispatch:
    inputs:
      since_hours:
        description: "Log error window in hours (default 26)"
        required: false
        default: ""
      log_lines:
        description: "Log lines to scan per application (default 3000)"
        required: false
        default: ""
  # Uncomment to ALSO run it automatically every morning:
  # schedule:
  #   - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run system check
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SINCE_HOURS: ${{ inputs.since_hours }}
          LOG_LINES: ${{ inputs.log_lines }}
        run: |
          set -u
          args="--no-state --no-color"
          [ -n "$SINCE_HOURS" ] && args="$args --since-hours $SINCE_HOURS"
          [ -n "$LOG_LINES" ] && args="$args --log-lines $LOG_LINES"
          python3 scripts/coolify_watchdog/check.py $args
